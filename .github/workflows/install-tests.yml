name: Installation tests
on:
    workflow_run:
        workflows: ['Platform tests']
        types: [completed]
jobs:
    build:
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        strategy:
            fail-fast: false
            max-parallel: 6
            matrix:
                platform: [ubuntu-latest, macos-latest, windows-latest]
                node-version: [24.x, 26.x]
        runs-on: ${{ matrix.platform }}
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v6
              with:
                  version: 12.18.0
                  run_install: false
            - name: Use Node.js ${{ matrix.node-version }} on ${{ matrix.platform }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - name: Pack CLI
              id: pack
              shell: bash
              run: |
                  pnpm pack --pack-destination "$RUNNER_TEMP"
                  node -e 'const fs = require("node:fs"); const p = require("./package.json"); fs.appendFileSync(process.env.GITHUB_OUTPUT, "package=" + p.name + "-" + p.version + ".tgz\n")'
            - name: Install packed CLI
              shell: bash
              run: |
                  node -e 'const fs = require("node:fs"); const path = require("node:path"); const dir = path.join(process.env.RUNNER_TEMP, "consumer"); fs.mkdirSync(dir, { recursive: true }); fs.writeFileSync(path.join(dir, "package.json"), JSON.stringify({ name: "sol2uml-light-install-test", version: "1.0.0", private: true }));'
                  pnpm --dir "$RUNNER_TEMP/consumer" add --allow-build=es5-ext "$RUNNER_TEMP/${{ steps.pack.outputs.package }}"
            - name: Render through the installed bin shim
              run: pnpm exec sol2uml-light class "${{ github.workspace }}/tests/contracts/current,${{ github.workspace }}/node_modules/@openzeppelin/contracts" -b ExampleToken -f svg -o "${{ runner.temp }}/shim-ExampleToken-class.svg"
              working-directory: ${{ runner.temp }}/consumer
            - name: Render and verify diagrams with the installed package
              run: node scripts/ci-render-diagrams.cjs "${{ runner.temp }}/consumer/node_modules/sol2uml-light/lib/sol2uml.js" "${{ runner.temp }}/diagrams"
