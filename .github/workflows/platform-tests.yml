name: Platform tests
on:
    workflow_run:
        workflows: ['Unit Tests']
        types: [completed]
jobs:
    build:
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        strategy:
            fail-fast: false
            max-parallel: 6
            matrix:
                platform: [ubuntu-latest, macos-latest, windows-latest]
                node-version: [24.x, 26.x]
        runs-on: ${{ matrix.platform }}
        steps:
            - uses: actions/checkout@v3
            - uses: pnpm/action-setup@v6
              with:
                  version: 12.18.0
                  run_install: false
            - name: Use Node.js ${{ matrix.node-version }} on ${{ matrix.platform }}
              uses: actions/setup-node@v3
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm run build
            - name: ExampleToken class SVG
              run: node ./lib/sol2uml.js class "./tests/contracts/current,node_modules/@openzeppelin/contracts" -b ExampleToken -f svg -o "${{ runner.temp }}/ExampleToken-class.svg"
            - name: ExampleToken storage PNG
              run: node ./lib/sol2uml.js storage "./tests/contracts/current,node_modules/@openzeppelin/contracts" -c ExampleToken -f png -o "${{ runner.temp }}/ExampleToken-storage.png"
            - name: ExampleNft class PNG
              run: node ./lib/sol2uml.js class "./tests/contracts/current,node_modules/@openzeppelin/contracts" -b ExampleNft -f png -o "${{ runner.temp }}/ExampleNft-class.png"
            - name: ExampleNft storage SVG
              run: node ./lib/sol2uml.js storage "./tests/contracts/current,node_modules/@openzeppelin/contracts" -c ExampleNft -f svg -o "${{ runner.temp }}/ExampleNft-storage.svg"
            - name: ExampleVault class DOT, SVG, and PNG
              run: node ./lib/sol2uml.js class "./tests/contracts/current,node_modules/@openzeppelin/contracts" -b ExampleVault -f all -o "${{ runner.temp }}/ExampleVault-class.svg"
            - name: ExampleVault storage DOT, SVG, and PNG
              run: node ./lib/sol2uml.js storage "./tests/contracts/current,node_modules/@openzeppelin/contracts" -c ExampleVault -f all -o "${{ runner.temp }}/ExampleVault-storage.svg"
            - name: Verify rendered diagrams
              run: node -e 'const fs = require("node:fs"); const path = require("node:path"); const names = ["ExampleToken-class.svg", "ExampleToken-storage.png", "ExampleNft-class.png", "ExampleNft-storage.svg", "ExampleVault-class.dot", "ExampleVault-class.svg", "ExampleVault-class.png", "ExampleVault-storage.dot", "ExampleVault-storage.svg", "ExampleVault-storage.png"]; for (const name of names) { const file = path.join(process.env.RUNNER_TEMP, name); if (!fs.existsSync(file) || fs.statSync(file).size === 0) throw new Error("Missing rendered diagram " + file); }'
